name: Aiba Browser Cloud Build

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      DEPOT_TOOLS_UPDATE: 0

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: 1. Purge Pre-installed Cloud Bloat
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/hostedtoolcache \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/share/swift

          docker system prune -af || true
          df -h

      - name: 2. Install Linux Build Utilities
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            python3 \
            python3-pip \
            ninja-build \
            build-essential \
            clang \
            lld \
            bison \
            gperf \
            curl \
            wget \
            flex \
            perl \
            pkg-config \
            zip \
            unzip \
            xz-utils \
            ca-certificates \
            nodejs \
            git \
            generate-ninja

          # Verify GN installation
          gn --version || true

      - name: 3. Create Swap Space
        run: |
          sudo fallocate -l 10G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

          free -h

      - name: 4. Execute Aiba Build Script
        run: |
          chmod +x build_aiba.sh
          ./build_aiba.sh

      - name: 5. Verify Build Output
        run: |
          ls -lah ungoogled-chromium/build/src/out/Default || true

      - name: 6. Zip Compiled Browser
        run: |
          cd ungoogled-chromium/build/src/out/Default

          # Adjust binary name if needed
          if [ -f chrome ]; then
            tar -czf Aiba-Browser-Linux.tar.gz chrome
          elif [ -f chromium ]; then
            tar -czf Aiba-Browser-Linux.tar.gz chromium
          else
            echo "Browser binary not found!"
            exit 1
          fi

      - name: 7. Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aiba-Browser-Ready
          path: ungoogled-chromium/build/src/out/Default/Aiba-Browser-Linux.tar.gz
          retention-days: 3
