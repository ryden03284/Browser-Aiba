name: Aiba Browser Cloud Build

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360 # 6 hours

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: 1. Purge Pre-installed Cloud Bloat (Maximize Storage)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache /opt/ghc /usr/local/share/boost /usr/share/swift
          docker system prune -af || true
          df -h # Verify disk space

      - name: 2. Install Linux Build Utilities
        run: |
          sudo apt-get update
          # Install gn directly from the official Ubuntu repositories
          sudo apt-get install -y \
            python3 python3-pip ninja-build build-essential clang lld bison gperf \
            curl wget flex perl pkg-config zip unzip xz-utils ca-certificates nodejs git gn
          
          # Verify gn is installed
          gn --version
          
          # Install latest GN
          wget -O gn.zip https://chrome-infra-packages.appspot.com/dl/gn/git_unzipped/linux-amd64/+/latest
          unzip gn.zip -d gn_bin
          sudo mv gn_bin/gn /usr/local/bin/gn
          sudo chmod +x /usr/local/bin/gn

      - name: 3. Create Swap Space (Safety for Chromium RAM needs)
        run: |
          sudo fallocate -l 10G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: 4. Execute Aiba Build Script
        run: |
          chmod +x build_aiba.sh
          ./build_aiba.sh

      - name: 5. Zip and Upload Compiled Package
        run: |
          # Matches the path output in your script
          cd ungoogled-chromium/build/src/out/Default
          tar -czf Aiba-Browser-Linux.tar.gz chrome
          
      - name: 6. Store Artifact for Download
        uses: actions/upload-artifact@v4
        with:
          name: Aiba-Browser-Ready
          path: ungoogled-chromium/build/src/out/Default/Aiba-Browser-Linux.tar.gz
          retention-days: 3
