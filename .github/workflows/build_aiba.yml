name: Aiba Browser Cloud Build

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      DEPOT_TOOLS_UPDATE: 0

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: 1. Purge Pre-installed Cloud Bloat
        run: |
          set -euxo pipefail
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/hostedtoolcache \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/share/swift || true

          docker system prune -af || true
          df -h

      - name: 2. Install Linux Build Utilities
        run: |
          set -euxo pipefail
          sudo apt-get update

          sudo apt-get install -y \
            python3 \
            python3-pip \
            ninja-build \
            build-essential \
            clang \
            lld \
            bison \
            gperf \
            curl \
            wget \
            flex \
            perl \
            pkg-config \
            zip \
            unzip \
            xz-utils \
            ca-certificates \
            nodejs \
            git \
            generate-ninja

          command -v gn
          gn --version || true

      - name: 3. Create Swap Space Safely
        run: |
          set -euxo pipefail

          SWAPFILE=/mnt/aiba-swapfile

          sudo swapoff "$SWAPFILE" || true
          sudo rm -f "$SWAPFILE" || true

          if ! sudo fallocate -l 8G "$SWAPFILE"; then
            sudo dd if=/dev/zero of="$SWAPFILE" bs=1M count=8192 status=progress
          fi

          sudo chmod 600 "$SWAPFILE"
          sudo mkswap "$SWAPFILE"
          sudo swapon "$SWAPFILE" || true

          free -h
          swapon --show || true

      - name: 4. Execute Aiba Build Script
        run: |
          set -euxo pipefail
          chmod +x build_aiba.sh
          ./build_aiba.sh

      - name: 5. Verify Build Output
        run: |
          set -euxo pipefail
          OUT_DIR="ungoogled-chromium/build/src/out/Default"
          ls -lah "$OUT_DIR"

      - name: 6. Zip Compiled Browser
        run: |
          set -euxo pipefail

          OUT_DIR="ungoogled-chromium/build/src/out/Default"

          if [ -f "$OUT_DIR/chrome" ]; then
            BIN="chrome"
          elif [ -f "$OUT_DIR/chromium" ]; then
            BIN="chromium"
          else
            BIN="$(find "$OUT_DIR" -maxdepth 1 -type f -perm -111 | head -n 1 | xargs -r basename || true)"
          fi

          if [ -z "${BIN:-}" ] || [ ! -f "$OUT_DIR/$BIN" ]; then
            echo "No browser binary found in $OUT_DIR"
            ls -lah "$OUT_DIR"
            exit 1
          fi

          tar -czf "$OUT_DIR/Aiba-Browser-Linux.tar.gz" -C "$OUT_DIR" "$BIN"

      - name: 7. Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aiba-Browser-Ready
          path: ungoogled-chromium/build/src/out/Default/Aiba-Browser-Linux.tar.gz
          retention-days: 3
